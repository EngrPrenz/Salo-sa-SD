<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="image/logo.png"/>
  <title>Salo sa Antipolo — Cashier Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,600;1,400;1,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="cashier-login.css">
</head>
<body>
<div class="bg"></div>
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div class="page">
  <div class="card">
    <div class="card-strip"></div>
    <div class="card-header">
      <div class="role-badge"><span></span>Cashier Portal</div>
      <h1 class="card-title">Payment<br><em>Processing</em></h1>
      <p class="card-subtitle">Sign in to process payments</p>
    </div>
    <div class="card-body">
      <div class="error-msg" id="errorMsg"><span>⚠</span><span id="errorText">Invalid credentials.</span></div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="cashier@email.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
          <button class="toggle-pw" id="togglePw" type="button">👁</button>
        </div>
      </div>
      <button class="btn-login" id="loginBtn">
        <span class="btn-text">Sign In as Cashier</span>
        <div class="btn-spinner"></div>
      </button>

      <div class="card-footer">
        <span class="footer-text">Salo sa Antipolo © 2025</span>
        <a href="admin-login.html" class="switch-link">← Admin Login</a>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><div class="toast-dot"></div><span id="toastMsg">Signing you in…</span></div>

<script type="module" src="cashier-login.js"></script>
</body>
</html>
